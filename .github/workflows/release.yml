name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow.path == '.github/workflows/ci.yml' &&
      github.event.workflow.id == github.event.workflow_run.workflow_id
    runs-on: ubuntu-24.04
    concurrency:
      group: release-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout trusted current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Record publication tools
        shell: bash
        run: |
          git --version
          gh --version
          jq --version
      - name: Verify target is on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - name: Publish authorized release
        shell: bash
        run: sh scripts/publish-release.sh "$GITHUB_REPOSITORY" "$TARGET_SHA"
