name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate documentation contract
        run: sh scripts/validate-documentation.sh

      - name: Run tests
        run: swift test -v
